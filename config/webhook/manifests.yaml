---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-v1-pod
  failurePolicy: Fail
  name: mpod-v1.kb.io
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
  # The handler creates the TensorFusionWorkload and reserves counters, ports
  # and indices for a real admission, and none of them for a dry-run.
  sideEffects: NoneOnDryRun
  timeoutSeconds: 30
  objectSelector:
    matchExpressions:
      - key: tensor-fusion.ai/enabled
        operator: In
        values:
          - "true"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-v1-pod-ephemeralcontainers
  # No objectSelector: labels can be changed after a pod is created, so the
  # handler selects pods by their volumes instead. The rule therefore sees every
  # pod, and must not hold up debugging when the operator is unavailable.
  failurePolicy: Ignore
  name: vpod-ephemeralcontainers-v1.kb.io
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - UPDATE
    resources:
    - pods/ephemeralcontainers
  sideEffects: None
  timeoutSeconds: 3
