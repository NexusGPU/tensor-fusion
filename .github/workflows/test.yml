name: Tests

on:
  push:
    branches:
      - main
      - release/**
    paths-ignore:
      - "*.md"
      - "charts/**"
      - "config/**"
  pull_request:
    branches:
      - main
      - release/**
    paths-ignore:
      - "*.md"
      - "charts/**"
      - "config/**"

permissions:
  contents: read

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # from https://github.com/kubernetes-sigs/controller-tools/blob/main/envtest-releases.yaml
        envtest_k8s_version: [1.23.5, 1.35.0]
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'

      - name: Running Tests
        run: |
          go mod vendor
          bash ./scripts/patch-scheduler.sh
          make test
        env:
          ENVTEST_K8S_VERSION: ${{ matrix.envtest_k8s_version }}

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'

      # The concurrency-sensitive packages only (see RACE_PACKAGES in the
      # Makefile); the whole suite under the race detector takes too long.
      - name: Running Tests with the race detector
        run: make test-race
        env:
          ENVTEST_K8S_VERSION: 1.35.0
