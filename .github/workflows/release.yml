name: Release

on:
  push:
    branches:
      - main
      - release/**
    paths-ignore:
      - "**/*.md"
      - "charts/**"
      - "config/**"
      - "docs/**"
      - "e2e/**"
  workflow_dispatch:

jobs:
  release:
    permissions:
      # to create release tags (cycjimmy/semantic-release-action)
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'

      - name: Semantic Release
        if: github.event_name == 'push'
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/release-notes-generator@^10
            @semantic-release/github@^8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_operator_image:
    needs:
      - release
    if: needs.release.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      # The tag the image is pushed with: the release version, or dev-<sha>
      # for a manual run. Read by the mirror job.
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: true

      - name: Build operator binaries
        run: |
          go mod vendor
          bash ./scripts/patch-scheduler.sh
          VERSION="${{ needs.release.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          GO_LDFLAGS="-X 'github.com/NexusGPU/tensor-fusion/internal/version.BuildVersion=${VERSION}'"
          # Build for amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="$GO_LDFLAGS" -a -o bin/manager-linux-amd64 ./cmd
          # Build for arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="$GO_LDFLAGS" -a -o bin/manager-linux-arm64 ./cmd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set Tag
        if: github.event_name == 'workflow_dispatch'
        id: set_tag
        run: echo "tag=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: tensorfusion/tensor-fusion-operator
          tags: ${{ github.event_name == 'workflow_dispatch' && steps.set_tag.outputs.tag || format('type=semver,pattern={{{{version}}}},value={0}', needs.release.outputs.version) }}

    
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push operator
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          file: dockerfile/operator.Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish_hypervisor_image:
    needs:
      - release
    if: needs.release.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: true

      - name: Build hypervisor binaries
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          GO_LDFLAGS="-X 'github.com/NexusGPU/tensor-fusion/internal/version.BuildVersion=${VERSION}'"
          # Build for amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="$GO_LDFLAGS" -a -o bin/hypervisor-linux-amd64 ./cmd/hypervisor
          # Build for arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="$GO_LDFLAGS" -a -o bin/hypervisor-linux-arm64 ./cmd/hypervisor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Set Tag
        if: github.event_name == 'workflow_dispatch'
        id: set_tag
        run: echo "tag=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
     
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: tensorfusion/tensor-fusion-hypervisor
          tags: ${{ github.event_name == 'workflow_dispatch' && steps.set_tag.outputs.tag || format('type=semver,pattern={{{{version}}}},value={0}', needs.release.outputs.version) }}

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push hypervisor
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          file: dockerfile/hypervisor.Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Copies the two images just pushed to the registry that
  # charts/tensor-fusion/values-cn.yaml points at. Without the registry
  # credentials the job only reports that it skipped; any other problem fails
  # it, after the Docker Hub images are already published.
  mirror:
    needs:
      - publish_operator_image
      - publish_hypervisor_image
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SRC: docker.io/tensorfusion
      DST: registry.cn-hangzhou.aliyuncs.com/tensorfusion
      OPERATOR_TAG: ${{ needs.publish_operator_image.outputs.tag }}
      HYPERVISOR_TAG: ${{ needs.publish_hypervisor_image.outputs.tag }}
    steps:
      # Secrets cannot be read in a job-level `if`, so a step turns their
      # presence into an output the later steps test.
      - name: Check mirror registry credentials
        id: credentials
        env:
          ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$ALIYUN_REGISTRY_USERNAME" ] || missing+=(ALIYUN_REGISTRY_USERNAME)
          [ -n "$ALIYUN_REGISTRY_PASSWORD" ] || missing+=(ALIYUN_REGISTRY_PASSWORD)
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          message="Images were not mirrored to $DST: repository secret(s) ${missing[*]} not set."
          echo "::notice title=Mirror skipped::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

      - name: Login to the mirror registry
        if: steps.credentials.outputs.available == 'true'
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      # The registry refuses the attestation manifests that buildx adds to an
      # image index ("unknown manifest class"), so the index cannot be copied
      # as a whole (`skopeo copy --all`). Each platform image is copied by
      # digest and an index of just those is created at the destination.
      - name: Copy the images
        if: steps.credentials.outputs.available == 'true'
        run: |
          set -euo pipefail
          skopeo --version
          docker buildx version

          mirror() { # mirror <image name> <tag>
            local name=$1 tag=$2 platforms arch digest refs=()
            if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]; then
              echo "::error::$name: the image job reported no usable tag ('$tag')"
              return 1
            fi
            platforms=$(skopeo inspect --retry-times 3 --raw "docker://$SRC/$name:$tag" |
              jq -r '.manifests[] | select(.platform.os=="linux" and (.platform.architecture=="amd64" or .platform.architecture=="arm64")) | "\(.platform.architecture) \(.digest)"' |
              sort)
            if [ "$(cut -d' ' -f1 <<<"$platforms" | paste -sd' ' -)" != "amd64 arm64" ]; then
              echo "::error::$SRC/$name:$tag: expected one linux/amd64 and one linux/arm64 image, found: ${platforms:-none}"
              return 1
            fi
            while read -r arch digest; do
              echo "Copying $SRC/$name@$digest to $DST/$name:${tag}_$arch"
              skopeo copy --retry-times 3 --preserve-digests \
                "docker://$SRC/$name@$digest" "docker://$DST/$name:${tag}_$arch"
              refs+=("$DST/$name:${tag}_$arch")
            done <<<"$platforms"
            docker buildx imagetools create -t "$DST/$name:$tag" "${refs[@]}"
          }

          mirror tensor-fusion-operator "$OPERATOR_TAG"
          mirror tensor-fusion-hypervisor "$HYPERVISOR_TAG"

      - name: Verify the mirrored images
        if: steps.credentials.outputs.available == 'true'
        run: |
          set -euo pipefail
          filter='[.manifests[] | "\(.platform.os)/\(.platform.architecture) \(.digest)"] | sort | .[]'
          failed=0
          fail() {
            echo "::error::$1"
            failed=1
          }

          verify() { # verify <image name> <tag>
            local name=$1 tag=$2 released mirrored platform digest copied
            released=$(skopeo inspect --retry-times 3 --raw "docker://$SRC/$name:$tag" |
              jq -r "$filter" | grep -E '^linux/(amd64|arm64) ') || released=""
            if [ "$(cut -d' ' -f1 <<<"$released" | paste -sd' ' -)" != "linux/amd64 linux/arm64" ]; then
              fail "$SRC/$name:$tag: expected one linux/amd64 and one linux/arm64 image, found: ${released:-none}"
              return 0
            fi
            while read -r platform digest; do
              copied=$(skopeo inspect --retry-times 3 --format '{{.Digest}}' \
                "docker://$DST/$name:${tag}_${platform#linux/}") || copied="not readable"
              if [ "$copied" = "$digest" ]; then
                echo "ok   $DST/$name:${tag}_${platform#linux/} is $digest"
              else
                fail "$DST/$name:${tag}_${platform#linux/} is $copied, but $platform of $SRC/$name:$tag is $digest"
              fi
            done <<<"$released"
            # Every entry of the index is compared, so anything besides the
            # two platform images is reported as well.
            mirrored=$(skopeo inspect --retry-times 3 --raw "docker://$DST/$name:$tag" |
              jq -r "$filter") || mirrored="not readable"
            if [ "$mirrored" = "$released" ]; then
              echo "ok   $DST/$name:$tag lists exactly linux/amd64 and linux/arm64, with the digests of $SRC/$name:$tag"
            else
              fail "$DST/$name:$tag does not list exactly the linux/amd64 and linux/arm64 images of $SRC/$name:$tag"
              printf 'released:\n%s\nmirrored:\n%s\n' "$released" "$mirrored"
            fi
          }

          verify tensor-fusion-operator "$OPERATOR_TAG"
          verify tensor-fusion-hypervisor "$HYPERVISOR_TAG"
          if [ "$failed" -ne 0 ]; then
            echo "::error::The mirrored images differ from the released ones."
            exit 1
          fi
          {
            echo "Mirrored to \`$DST\`:"
            echo "- \`tensor-fusion-operator:$OPERATOR_TAG\`"
            echo "- \`tensor-fusion-hypervisor:$HYPERVISOR_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
