name: Lint

on:
  push:
    branches:
      - main
      - release/**
    paths-ignore:
      - "*.md"
      - "charts/**"
      - "config/**"
  pull_request:
    branches:
      - main
      - release/**
    paths-ignore:
      - "*.md"
      - "charts/**"
      - "config/**"

jobs:
  lint:
    name: Run on Ubuntu
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'

      - name: Install Deps
        run: |
          go mod vendor
          bash ./scripts/patch-scheduler.sh
      - name: Install linter
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
      - name: Run linter
        run: "$RUNNER_TEMP/bin/golangci-lint run"
