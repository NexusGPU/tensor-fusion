apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "tensor-fusion.fullname" . }}-mutating-webhook
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "tensor-fusion.fullname" . }}-webhook
      namespace: {{ include "tensor-fusion.namespace" . }}
      path: /mutate-v1-pod
  failurePolicy: {{ .Values.controller.admissionWebhooks.failurePolicy }}
  name: mpod.tensor-fusion.ai
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
  sideEffects: None
  timeoutSeconds: 10
# Migration modes must inspect pods without the TensorFusion enabled label so
# that native GPU resource requests can be discovered and converted.
{{ if not (or .Values.controller.nvidiaOperatorProgressiveMigration (dig "autoMigration" "enable" false .Values.dynamicConfig)) }}
  objectSelector:
    matchExpressions:
      - key: tensor-fusion.ai/enabled
        operator: In
        values:
          - "true"
{{ end }}
