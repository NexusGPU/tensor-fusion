{{- if include "tensor-fusion.agent.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tensor-fusion.agent.secretName" . }}
  namespace: {{ include "tensor-fusion.namespace" . }}
  labels:
    tensor-fusion.ai/component: cluster-agent
    {{- include "tensor-fusion.labels" . | nindent 4 }}
type: Opaque
data:
  enroll-token: {{ .Values.agent.enrollToken | toString | b64enc | quote }}
  agent-id: {{ .Values.agent.agentId | toString | b64enc | quote }}
{{- end }}
