apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tensor-fusion.fullname" . }}-controller
  namespace: {{ include "tensor-fusion.namespace" . }}
  labels:
    tensor-fusion.ai/component: operator
    {{- include "tensor-fusion.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tensor-fusion.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
      tensor-fusion.ai/component: operator
  template:
    metadata:
      {{- /* A change of the agent Secret restarts the pod, so that the
             cluster-agent sidecar picks up a rotated token. Only the Secret the
             chart creates can be tracked this way. */}}
      {{- $agentSecret := "" }}
      {{- if include "tensor-fusion.agent.createSecret" . }}
      {{- $agentSecret = include (print $.Template.BasePath "/agent-secret.yaml") . | sha256sum }}
      {{- end }}
      {{- if or .Values.controller.podAnnotations $agentSecret }}
      annotations:
        {{- with .Values.controller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $agentSecret }}
        checksum/agent-secret: {{ . | quote }}
        {{- end }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "tensor-fusion.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: controller
        tensor-fusion.ai/component: operator
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tensor-fusion.serviceAccountName" . }}
      enableServiceLinks: false
      priorityClassName: "system-cluster-critical"
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default .Chart.AppVersion }}"
          command: 
            {{- toYaml .Values.controller.command | nindent 12 }}
            {{- if .Values.controller.compatibleWithNvidiaContainerToolkit }}
            - --compatible-with-nvidia-container-toolkit=true
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.controller.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.controller.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          env:
            - name: TF_ISOLATION_MODE_POLICY
              value: {{ .Values.controller.isolationModePolicy | default "dynamic" | quote }}
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            # when deploy with AutoSelect mode, GPU node is managed by Kubernetes rather than TensorFusion, thus, need to specify the label selector to generate the GPUNode custom resource
            - name: INITIAL_GPU_NODE_LABEL_SELECTOR
              value: "{{ .Values.initialGpuNodeLabelSelector }}"
            - name: TSDB_MYSQL_HOST
              value: "{{ .Values.greptime.host }}"
            - name: TSDB_MYSQL_PORT
              value: "{{ .Values.greptime.port }}"
            - name: TSDB_MYSQL_DATABASE
              value: "{{ .Values.greptime.db }}"
            {{- if .Values.greptime.isCloud }}
            - name: TSDB_MYSQL_USER
              value: "{{ .Values.greptime.user }}"
            - name: TSDB_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-greptimedb-secret
                  key: password
            # The Secret the Vector sidecars of the hypervisor pods take the
            # database password from.
            - name: TSDB_PASSWORD_SECRET_NAME
              value: {{ .Release.Name }}-greptimedb-secret
            {{- else }}
            - name: TSDB_MYSQL_USER
              value: root
            {{- end }}
            {{- if .Values.controller.nvidiaOperatorProgressiveMigration }}
            - name: NVIDIA_OPERATOR_PROGRESSIVE_MIGRATION
              value: "true"
            {{- end }}
          volumeMounts:
            - name: cert
              readOnly: true
              mountPath: /tmp/k8s-webhook-server/serving-certs
            - name: logs
              mountPath: /logs
            - name: cloud-vendor-credentials
              mountPath: /tmp/secret
              readOnly: true
            - name: gpu-info
              mountPath: /etc/tensor-fusion/gpu-info.yaml
              subPath: gpu-info.yaml
              readOnly: true
            - name: config
              mountPath: /etc/tensor-fusion/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /etc/tensor-fusion/scheduler-config.yaml
              subPath: scheduler-config.yaml
              readOnly: true
        {{- if include "tensor-fusion.agent.enabled" . }}
        - name: cluster-agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default "latest" }}"
          env:
            - name: CLOUD_ENDPOINT
              value: "{{ .Values.agent.cloudEndpoint }}"
            {{- with include "tensor-fusion.agent.namespaceList" (list "namespaceAllowlist" .Values.agent.namespaceAllowlist) }}
            - name: AGENT_NAMESPACE_ALLOWLIST
              value: {{ . | quote }}
            {{- end }}
            {{- with include "tensor-fusion.agent.namespaceList" (list "namespaceDenylist" .Values.agent.namespaceDenylist) }}
            - name: AGENT_NAMESPACE_DENYLIST
              value: {{ . | quote }}
            {{- end }}
            # The agent's credentials come from a Secret, never from a value in
            # this pod spec, which everyone who may read pods can read.
            - name: AGENT_ID
              {{- if include "tensor-fusion.agent.idKey" . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "tensor-fusion.agent.secretName" . }}
                  key: {{ include "tensor-fusion.agent.idKey" . }}
              {{- else }}
              value: "{{ .Values.agent.agentId }}"
              {{- end }}
            - name: ENROLL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "tensor-fusion.agent.secretName" . }}
                  key: {{ include "tensor-fusion.agent.tokenKey" . }}
            - name: TSDB_MYSQL_HOST
              value: "{{ .Values.greptime.host }}"
            - name: TSDB_MYSQL_PORT
              value: "{{ .Values.greptime.port }}"
            - name: TSDB_MYSQL_DATABASE
              value: "{{ .Values.greptime.db }}"
            {{- if .Values.greptime.isCloud }}
            - name: TSDB_MYSQL_USER
              value: "{{ .Values.greptime.user }}"
            - name: TSDB_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-greptimedb-secret
                  key: password
            {{- else }}
            - name: TSDB_MYSQL_USER
              value: "root"
            {{- end }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
        {{- end }}
        - name: vector
          image: {{ .Values.controller.vectorAgentImage }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            {{- if .Values.greptime.isCloud }}
            # Referenced as ${GREPTIME_PASSWORD} by the Vector configuration.
            - name: GREPTIME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-greptimedb-secret
                  key: password
            {{- end }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: logs
              mountPath: /logs
            - name: vector-config
              mountPath: /etc/vector/vector.yaml
              subPath: vector-operator.yaml
            - name: kubernetes-logs
              mountPath: /var/log/pods
      volumes:
        - name: cert
          secret:
            secretName: {{.Values.controller.admissionWebhooks.secretName}}
            defaultMode: 420
            items:
              - key: cert
                path: tls.crt
              - key: key
                path: tls.key
        - name: vector-config
          configMap:
            name: tensor-fusion-sys-vector-config
            defaultMode: 420
        - name: cloud-vendor-credentials
          secret:
            secretName: tf-cloud-vendor-credentials
            defaultMode: 420
        - configMap:
            defaultMode: 420
            name: tensor-fusion-sys-public-gpu-info
          name: gpu-info
        - configMap:
            defaultMode: 420
            name: {{ .Release.Name }}-config
          name: config
        - name: logs
          emptyDir: {}
        - name: kubernetes-logs
          hostPath:
            path: /var/log/pods
            type: DirectoryOrCreate
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
