version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      - linters:
          - gocyclo
        path: internal/controller/gpupool_defrag.go
        text: placeSinglePod
      - linters:
          - prealloc
        path: internal/controller/gpupool_defrag.go
        text: accounting
      - linters:
          - unparam
        path: internal/controller/gpunode_controller.go
        text: syncNodeAndOwnedGPUPhases
      - linters:
          - goconst
        path: internal/controller/gpupool_defrag_test.go
        text: 'node-(source|buddy)'
      - linters:
          - unparam
        path: internal/controller/gpupool_defrag_test.go
        text: 'newDefragWorkerPDB|newSchedulerTestPod'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - cmd/nodediscovery/main.go
      - third_party$
      - builtin$
      - examples$
